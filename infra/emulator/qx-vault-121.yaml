services:
  qx-vault-121:
    image: qx-vault:1.2.1-qxos6.0.0-syslog-support
    container_name: qx-vault-121
    privileged: true
    environment:
      - SERIAL_NUMBER=QXV0000001
    ports:
      - "8200:8200" # Vault API
      - "8201:8201" # Vault cluster service port
      - "8222:8222" # Operator shell
      - "8202:8202" # QxVault clusterjoin port
      - "8300:8300" # Extra Vault API listener
      - "8135:8135" # QxRealm
      - "8142:8142" # QxConsole
      - "8127:8127" # QxSSO
    volumes:
      - vaultEmu121HsmData:/opt/qx-emulator/hsmEmulator
      - vaultEmu121SbcData:/opt/qx-emulator/north1
      - vaultEmu121DockerData:/var/lib/docker

volumes:
  vaultEmu121HsmData:
  vaultEmu121SbcData:
  vaultEmu121DockerData:
