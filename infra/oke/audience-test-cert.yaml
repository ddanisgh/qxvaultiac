apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: audience-test-cert
  namespace: default
spec:
  secretName: audience-test-tls

  privateKey:
    algorithm: ECDSA
    size: 256

  commonName: test.internal.example.com

  dnsNames:
    - test.internal.example.com

  issuerRef:
    kind: ClusterIssuer
    name: vault-issuer

