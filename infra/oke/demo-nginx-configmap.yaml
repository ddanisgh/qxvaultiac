apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-web-nginx
  namespace: default
data:
  default.conf: |
    server {
      listen 443 ssl;
      server_name demo.internal.example.com;

      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;

      location / {
        default_type text/plain;
        return 200 "Hello from OpenBao PKI and cert-manager!\n";
      }
    }
