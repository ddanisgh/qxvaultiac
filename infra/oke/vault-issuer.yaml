# vault-issuer.yaml
# ClusterIssuer that connects cert-manager to Vault PKI
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    # Vault server address
    server: https://vault.example.com:8200

    # Path to the PKI secrets engine
    path: hearts/pki_int/sign/internal-services

    # Authentication method - using Kubernetes auth
    auth:
      kubernetes:
        # Vault role configured for cert-manager
        role: cert-manager
        # Path to the Kubernetes auth mount in Vault
        mountPath: /v1/hearts/auth/kubernetes
        # Service account used by cert-manager to request a short-lived token
        serviceAccountRef:
          name: vault-issuer
          # Add both the vault://vault-issuer and api audiences
          audiences:
            - vault://vault-issuer
            - api
    # CA bundle to verify Vault's TLS certificate
    caBundle: 
